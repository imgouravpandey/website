{{- /* Compact log-style post row. Context: a post page. */}}
<a class="post-row" href="{{ .Permalink }}">
  <time class="post-row-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  <span class="post-row-title">{{ .Title }}</span>
  <span class="post-row-meta">
    {{- with .Params.tags }}{{ range first 2 . }}<span class="post-row-tag">#{{ . }}</span>{{ end }}{{ end -}}
  </span>
</a>
